    <text x="730" y="195" fill="#656d76" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1">SUBTASK 1 (PUN F1)</text>
    <text x="855" y="195" fill="#656d76" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1">DETECTION ACC</text>
    <text x="955" y="195" fill="#656d76" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1">VS SOTA</text>
    
