        <rect x="684" y="273" width="76" height="7" rx="3.5" fill="#eaeef2"/>
        <rect x="684" y="273" width="62.7" height="7" rx="3.5" fill="#0969da"/>
        
        <!-- Subtask 2 Location Acc -->
