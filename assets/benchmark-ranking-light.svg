        <rect x="684" y="361" width="76" height="7" rx="3.5" fill="#eaeef2"/>
        <rect x="684" y="361" width="52.1" height="7" rx="3.5" fill="#0969da"/>
        
        <!-- Subtask 2 Location Acc -->
        <text x="855" y="370" fill="#1f2328" font-size="13.5" font-weight="500" text-anchor="end">48.23%</text>
        
        <!-- Delta vs Duluth -->
        <text x="955" y="370" fill="#656d76" font-size="12" font-weight="600" text-anchor="end">-13.93%</text>
        
        <!-- Row 5 -->
        <rect x="20" y="388" width="960" height="40" rx="6" fill="#f6f8fa" />
        
            <text x="48" y="414" fill="#59636e" font-size="13" font-weight="500" text-anchor="middle">#5</text>
            
        <text x="88" y="414" fill="#1f2328" font-size="13.5" font-weight="500" text-anchor="start">UW-Stanford (SemEval-2017)</text>
        <text x="315" y="414" fill="#59636e" font-size="12" font-weight="400" text-anchor="start">Statistical Language Model Baseline</text>
        
        <!-- Subtask 1 Pun F1 -->
        <text x="670" y="414" fill="#1f2328" font-size="13.5" font-weight="500" text-anchor="end">66.37%</text>
        <rect x="684" y="405" width="76" height="7" rx="3.5" fill="#eaeef2"/>
        <rect x="684" y="405" width="50.4" height="7" rx="3.5" fill="#0969da"/>
        
