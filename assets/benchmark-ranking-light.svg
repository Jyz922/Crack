        <!-- Row 3 -->
        <rect x="20" y="300" width="960" height="40" rx="6" fill="#f6f8fa" />
        
            <text x="48" y="326" fill="#59636e" font-size="13" font-weight="500" text-anchor="middle">#3</text>
            
