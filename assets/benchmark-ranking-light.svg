<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="665" viewBox="0 0 1000 665" role="img" aria-labelledby="title description">
  <title id="title">SemEval-2017 Task 7 Benchmark: CRACK Achieves SOTA (87.82% F1)</title>
  <desc id="description">Performance comparison on the official 2,250-item SemEval-2017 Task 7 benchmark for English pun detection and location. CRACK ranks #1 with 87.82% F1 and 76.35% exact word location accuracy.</desc>
  
  <!-- Outer Card Container -->
  <rect x="0.5" y="0.5" width="999" height="664" rx="14" fill="#ffffff" stroke="#e1e4e8"/>
  
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-variant-numeric="tabular-nums">
    <!-- Header Badge & Eyebrow -->
    <text x="32" y="38" fill="#0969da" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.5">CRACK  /  BENCHMARKS</text>
    <text x="32" y="74" fill="#1f2328" font-size="28" font-weight="700" text-anchor="start">SemEval-2017 Task 7: English Puns</text>
    <text x="32" y="100" fill="#59636e" font-size="14.5" font-weight="400" text-anchor="start">Official gold-standard benchmark (2,250 items: 1,607 homographic puns + 643 negative controls)</text>
    <text x="32" y="122" fill="#0969da" font-size="12" font-weight="600" text-anchor="start">SOURCE: SemEval-2017 Task 7 Proceedings (Miller et al., ACL S17-2007)</text>
    
    <!-- Top-Right Callout Highlight Box -->
    <rect x="735" y="24" width="233" height="92" rx="10" fill="#f0f6ff" stroke="#bfdbfe"/>
    <text x="851" y="49" fill="#0969da" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1.2">LEADERBOARD RANK</text>
    <text x="851" y="85" fill="#0969da" font-size="30" font-weight="800" text-anchor="middle">#1 SOTA</text>
    <text x="851" y="103" fill="#656d76" font-size="11" font-weight="500" text-anchor="middle">87.82% F1 · Subtask 1 &amp; 2</text>
    
    <!-- Sub-header metadata line -->
    <text x="32" y="146" fill="#656d76" font-size="11.5" font-weight="600" text-anchor="start" letter-spacing="0.8">TEST SPLIT EVALUATION  ·  ZERO-SHOT SYMBOLIC GROUNDING</text>
    <text x="955" y="146" fill="#656d76" font-size="12" font-weight="400" text-anchor="end">Higher is better</text>
    <path d="M20 158 H980" stroke="#d1d9e0" stroke-width="1"/>
    
    <!-- Table Column Headers -->
    <text x="48" y="195" fill="#656d76" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">RANK</text>
    <text x="88" y="195" fill="#656d76" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1">SYSTEM / MODEL</text>
    <text x="315" y="195" fill="#656d76" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1">PARADIGM &amp; ARCHITECTURE</text>
    <text x="730" y="195" fill="#656d76" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1">SUBTASK 1 (PUN F1)</text>
    <text x="855" y="195" fill="#656d76" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1">SUBTASK 2 (LOC)</text>
    <text x="955" y="195" fill="#656d76" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1">VS WINNER</text>
    
    <!-- Table Rows -->
    
        <!-- Row 1 -->
        <rect x="20" y="212" width="960" height="40" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
        
            <rect x="22" y="221" width="52" height="22" rx="4" fill="#1a7f37"/>
            <text x="48" y="236" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">#1 SOTA</text>
            
        <text x="88" y="238" fill="#1a7f37" font-size="13.5" font-weight="700" text-anchor="start">CRACK (Ours)</text>
        <text x="315" y="238" fill="#59636e" font-size="12" font-weight="400" text-anchor="start">Neuro-Symbolic (WordNet + gpt-6-luna)</text>
        
        <!-- Subtask 1 Pun F1 -->
        <text x="670" y="238" fill="#1a7f37" font-size="13.5" font-weight="700" text-anchor="end">87.82%</text>
        <rect x="684" y="229" width="76" height="7" rx="3.5" fill="#cce5d6"/>
        <rect x="684" y="229" width="66.7" height="7" rx="3.5" fill="#1a7f37"/>
        
        <!-- Subtask 2 Location Acc -->
