        <text x="955" y="502" fill="#656d76" font-size="12" font-weight="600" text-anchor="end">-20.06%</text>
        
    
    <!-- Stat Summary Section -->
    
    <!-- Summary Stat Cards -->
    <g transform="translate(20, 534)">
      <!-- Stat 1 -->
      <rect x="0" y="0" width="228" height="66" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="16" y="24" fill="#59636e" font-size="11" font-weight="600" letter-spacing="0.5">SUBTASK 1 (PUN F1)</text>
      <text x="16" y="52" fill="#1a7f37" font-size="22" font-weight="700">87.82%</text>
