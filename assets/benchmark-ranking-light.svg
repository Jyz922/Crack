<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title description">
  <title id="title">CRACK reported SemEval run summary</title>
  <desc id="description">Reported classification metrics from a local SemEval-2017 Task 7 run. The run records are not included in a clean Git checkout; this is not a leaderboard comparison.</desc>
  <rect x="0.5" y="0.5" width="959" height="469" rx="14" fill="#ffffff" stroke="#d1d9e0"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-variant-numeric="tabular-nums">
    <text x="32" y="42" fill="#0969da" font-size="12" font-weight="700" letter-spacing="1.4">REPORTED LOCAL RUN</text>
    <text x="32" y="82" fill="#1f2328" font-size="26" font-weight="700">SemEval-2017 Task 7 · detection</text>
    <text x="32" y="110" fill="#59636e" font-size="13">Arithmetic checked against locally available records; model-call provenance is not independently verified.</text>

    <rect x="32" y="152" width="896" height="40" rx="6" fill="#f6f8fa"/>
    <text x="50" y="177" fill="#1f2328" font-size="14">Detection accuracy</text>
    <text x="700" y="177" fill="#0969da" font-size="14" font-weight="700" text-anchor="end">82.84%</text>
    <text x="910" y="177" fill="#59636e" font-size="12" text-anchor="end">1,864 / 2,250</text>

    <rect x="32" y="200" width="896" height="40" rx="6" fill="#f6f8fa"/>
    <text x="50" y="225" fill="#1f2328" font-size="14">Pun precision</text>
    <text x="700" y="225" fill="#0969da" font-size="14" font-weight="700" text-anchor="end">89.11%</text>
    <text x="910" y="225" fill="#59636e" font-size="12" text-anchor="end">1,391 / 1,561</text>

    <rect x="32" y="248" width="896" height="40" rx="6" fill="#f6f8fa"/>
    <text x="50" y="273" fill="#1f2328" font-size="14">Pun recall</text>
    <text x="700" y="273" fill="#0969da" font-size="14" font-weight="700" text-anchor="end">86.56%</text>
    <text x="910" y="273" fill="#59636e" font-size="12" text-anchor="end">1,391 / 1,607</text>

    <rect x="32" y="296" width="896" height="40" rx="6" fill="#f6f8fa"/>
    <text x="50" y="321" fill="#1f2328" font-size="14">Pun F1</text>
    <text x="700" y="321" fill="#0969da" font-size="14" font-weight="700" text-anchor="end">87.82%</text>
    <text x="910" y="321" fill="#59636e" font-size="12" text-anchor="end">from reported precision and recall</text>

    <rect x="32" y="344" width="896" height="40" rx="6" fill="#f6f8fa"/>
    <text x="50" y="369" fill="#1f2328" font-size="14">Negative controls classified ONE_SENSE_ONLY</text>
    <text x="700" y="369" fill="#0969da" font-size="14" font-weight="700" text-anchor="end">73.56%</text>
    <text x="910" y="369" fill="#59636e" font-size="12" text-anchor="end">473 / 643</text>

    <text x="32" y="430" fill="#59636e" font-size="12">Not a state-of-the-art claim. See docs/benchmark_audit.md for limitations.</text>
  </g>
</svg>
