    <text x="32" y="76" fill="#f0f6fc" font-size="28" font-weight="700" text-anchor="start">SemEval-2017 Task 7: English Puns</text>
    <text x="32" y="104" fill="#8b949e" font-size="14.5" font-weight="400" text-anchor="start">Official gold-standard benchmark (2,250 items: 1,607 homographic puns + 643 negative controls)</text>
    
