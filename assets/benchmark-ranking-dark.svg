    <text x="968" y="146" fill="#6e7681" font-size="12" font-weight="400" text-anchor="end">Higher is better</text>
    <path d="M20 162 H980" stroke="#21262d" stroke-width="1"/>
    
    <!-- Table Column Headers -->
    <text x="49" y="205" fill="#6e7681" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">RANK</text>
    <text x="82" y="205" fill="#6e7681" font-size="11" font-weight="700" text-anchor="start" letter-spacing="1">SYSTEM / MODEL</text>
