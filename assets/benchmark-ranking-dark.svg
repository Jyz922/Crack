    <text x="745" y="205" fill="#6e7681" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1">SUBTASK 1 (PUN F1)</text>
    <text x="880" y="205" fill="#6e7681" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1">SUBTASK 2 (LOC)</text>
    <text x="965" y="205" fill="#6e7681" font-size="11" font-weight="700" text-anchor="end" letter-spacing="1">VS WINNER</text>
    
    <!-- Table Rows -->
    
        <!-- Row 1 -->
