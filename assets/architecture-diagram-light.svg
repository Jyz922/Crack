<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">CRACK System Architecture: 8-Layer Neuro-Symbolic Pipeline</title>
  <desc id="arch-desc">Hierarchical diagram of the CRACK humor evaluation system across 3 distinct phases: deterministic lexical foundation, constrained LLM reasoning, and developmental safety evaluation.</desc>
  
  <!-- Outer Card -->
  <rect x="0.5" y="0.5" width="999" height="729" rx="14" fill="#ffffff" stroke="#e1e4e8"/>
  
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-variant-numeric="tabular-nums">
    <!-- Header -->
    <text x="32" y="38" fill="#0969da" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.5">CRACK  /  SYSTEM PIPELINE</text>
    <text x="32" y="74" fill="#1f2328" font-size="26" font-weight="700" text-anchor="start">Neuro-Symbolic 8-Layer Architecture (L0–L8)</text>
    <text x="32" y="100" fill="#59636e" font-size="14" font-weight="400" text-anchor="start">Deterministic lexical ontologies + Schema-constrained LLM reasoning + Developmental multi-age modeling</text>
    
    <!-- Top Input Bar -->
    <g transform="translate(20, 118)">
      <rect x="0" y="0" width="960" height="42" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
      <rect x="14" y="10" width="56" height="22" rx="4" fill="#ddf4ff" stroke="#54aeff66"/>
      <text x="42" y="25" fill="#0969da" font-size="11" font-weight="700" text-anchor="middle">INPUT</text>
      <text x="82" y="26" fill="#1f2328" font-size="13" font-weight="600">Raw Joke Text + Target Ages (e.g. 6, 8, 10, 12)</text>
      <text x="946" y="26" fill="#656d76" font-size="12" text-anchor="end">Single unified CLI / Python entrypoint</text>
    </g>

    <!-- Column 1: Stage 1 Deterministic Foundation -->
    <g transform="translate(20, 174)">
      <rect x="0" y="0" width="306" height="474" rx="10" fill="#f6f8fa" stroke="#54aeff66" stroke-width="1.2"/>
      
      <!-- Stage Header -->
      <rect x="14" y="14" width="138" height="22" rx="4" fill="#ddf4ff"/>
      <text x="83" y="29" fill="#0969da" font-size="10.5" font-weight="700" text-anchor="middle">STAGE 1 · SYMBOLIC</text>
      <text x="14" y="58" fill="#1f2328" font-size="17" font-weight="700">Lexical Foundation</text>
      <text x="14" y="76" fill="#59636e" font-size="12">0 Tokens · Deterministic Search</text>
      
      <!-- Block 1: L0 -->
      <rect x="14" y="94" width="278" height="74" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="26" y="116" fill="#1f2328" font-size="13" font-weight="700">L0 — Scope Boundary Gate</text>
      <text x="26" y="134" fill="#59636e" font-size="11.5">Accepts homographs &amp; splits</text>
      <text x="26" y="152" fill="#656d76" font-size="11">Filters homophones &amp; rhymes</text>

      <!-- Block 2: L1 -->
      <rect x="14" y="178" width="278" height="74" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="26" y="200" fill="#1f2328" font-size="13" font-weight="700">L1 — Syntactic &amp; Genre Routing</text>
      <text x="26" y="218" fill="#59636e" font-size="11.5">Tokenize, POS, Lemmatization</text>
      <text x="26" y="236" fill="#656d76" font-size="11">Routes: QA, Dialogue, One-Liner, Decl</text>

      <!-- Block 3: L2 -->
      <rect x="14" y="262" width="278" height="74" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="26" y="284" fill="#1f2328" font-size="13" font-weight="700">L2 — Symbolic Sense Retrieval</text>
      <text x="26" y="302" fill="#59636e" font-size="11.5">WordNet 3.0 Synsets + SemCor</text>
      <text x="26" y="320" fill="#656d76" font-size="11">Kuperman AoA 4-stage join</text>

      <!-- Block 4: L3 -->
      <rect x="14" y="346" width="278" height="74" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="26" y="368" fill="#1f2328" font-size="13" font-weight="700">L3 — Candidate Ranking</text>
      <text x="26" y="386" fill="#59636e" font-size="11.5">Contrast (0.70) + Balance (0.30)</text>
      <text x="26" y="404" fill="#0969da" font-size="11" font-weight="600">Extracts Top-8 candidates -&gt;</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <path d="M331 411 H342 M337 407 L342 411 L337 415" stroke="#0969da" stroke-width="2" fill="none"/>

    <!-- Column 2: Stage 2 Constrained LLM Reasoning -->
    <g transform="translate(347, 174)">
      <rect x="0" y="0" width="306" height="474" rx="10" fill="#f6f8fa" stroke="#c297ff66" stroke-width="1.2"/>
      
      <!-- Stage Header -->
      <rect x="14" y="14" width="132" height="22" rx="4" fill="#fbefff"/>
      <text x="80" y="29" fill="#8250df" font-size="10.5" font-weight="700" text-anchor="middle">STAGE 2 · NEURAL</text>
      <text x="14" y="58" fill="#1f2328" font-size="17" font-weight="700">Constrained Reasoning</text>
      <text x="14" y="76" fill="#59636e" font-size="12">Verbatim Quote Grounding</text>
      
      <!-- Block 1: L4 -->
      <rect x="14" y="94" width="278" height="106" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="26" y="116" fill="#1f2328" font-size="13" font-weight="700">L4 — Bidirectional Anchoring</text>
      <text x="26" y="134" fill="#59636e" font-size="11.5">Requires non-empty substring</text>
      <text x="26" y="150" fill="#59636e" font-size="11.5">quotes for Sense A &amp; Sense B</text>
      <!-- Short-circuit pill -->
      <rect x="24" y="162" width="248" height="24" rx="4" fill="#ffebe9" stroke="#ff818266"/>
      <text x="148" y="178" fill="#cf222e" font-size="10.5" font-weight="700" text-anchor="middle">ONE_SENSE_ONLY -&gt; Early Exit (73.6%)</text>

      <!-- Block 2: L5 -->
      <rect x="14" y="210" width="278" height="106" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="26" y="232" fill="#1f2328" font-size="13" font-weight="700">L5 — Incongruity Resolution</text>
      <text x="26" y="250" fill="#59636e" font-size="11.5">QA: Polarity, Causal, Event Fit</text>
      <text x="26" y="268" fill="#59636e" font-size="11.5">Dialogue: Speaker mismatch</text>
      <text x="26" y="286" fill="#656d76" font-size="11">Definitional: Punchline resegmentation</text>

      <!-- Block 3: L6 -->
      <rect x="14" y="326" width="278" height="94" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="26" y="348" fill="#1f2328" font-size="13" font-weight="700">L6 — Sense Distinctness</text>
      <text x="26" y="366" fill="#59636e" font-size="11.5">Paraphrase ablation test</text>
      <text x="26" y="384" fill="#59636e" font-size="11.5">Filters polysemous synonyms</text>
      <text x="26" y="402" fill="#8250df" font-size="11" font-weight="600">SENSES_DISTINCT -&gt; To L7</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <path d="M658 411 H669 M664 407 L669 411 L664 415" stroke="#8250df" stroke-width="2" fill="none"/>

    <!-- Column 3: Stage 3 Cognitive & Safety -->
    <g transform="translate(674, 174)">
      <rect x="0" y="0" width="306" height="474" rx="10" fill="#f6f8fa" stroke="#4ac26b66" stroke-width="1.2"/>
      
      <!-- Stage Header -->
      <rect x="14" y="14" width="144" height="22" rx="4" fill="#dafbe1"/>
      <text x="86" y="29" fill="#1a7f37" font-size="10.5" font-weight="700" text-anchor="middle">STAGE 3 · COGNITIVE</text>
      <text x="14" y="58" fill="#1f2328" font-size="17" font-weight="700">Safety &amp; Assessment</text>
      <text x="14" y="76" fill="#59636e" font-size="12">Multi-Age Developmental Model</text>
      
      <!-- Block 1: L7 -->
      <rect x="14" y="94" width="278" height="96" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="26" y="116" fill="#1f2328" font-size="13" font-weight="700">L7 — Comprehension Model</text>
      <text x="26" y="134" fill="#59636e" font-size="11.5">Dual-Sense AoA evaluation</text>
      <text x="26" y="152" fill="#59636e" font-size="11.5">Metalinguistic floor matching</text>
      <text x="26" y="170" fill="#656d76" font-size="11">Verdicts for Ages 6, 8, 10, 12</text>

      <!-- Block 2: L8 -->
      <rect x="14" y="200" width="278" height="96" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="26" y="222" fill="#1f2328" font-size="13" font-weight="700">L8 — Two-Axis Appropriateness</text>
      <text x="26" y="240" fill="#59636e" font-size="11.5">Axis 1: Surface (violence, adult)</text>
      <text x="26" y="258" fill="#59636e" font-size="11.5">Axis 2: Inference (legal, financial)</text>
      <text x="26" y="276" fill="#656d76" font-size="11">Protects young readers</text>

      <!-- Block 3: Output -->
      <rect x="14" y="306" width="278" height="114" rx="6" fill="#dafbe1" stroke="#4ac26b66"/>
      <text x="26" y="328" fill="#1a7f37" font-size="13" font-weight="700">FINAL CLASSIFICATION</text>
      <text x="26" y="348" fill="#1f2328" font-size="12" font-weight="600">• Classification (HOMOGRAPH / SPLIT)</text>
      <text x="26" y="366" fill="#1f2328" font-size="12" font-weight="600">• Pun Word Location + Context Quotes</text>
      <text x="26" y="384" fill="#1f2328" font-size="12" font-weight="600">• Per-Age Appropriateness Verdicts</text>
      <text x="26" y="402" fill="#59636e" font-size="11">Full reproducible JSON audit trace</text>
    </g>

    <!-- Bottom Rejection Funnel Callout -->
    <g transform="translate(20, 660)">
      <rect x="0" y="0" width="960" height="50" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
      <rect x="14" y="13" width="118" height="24" rx="4" fill="#1a7f37"/>
      <text x="73" y="29" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">TOKEN EFFICIENCY</text>
      <text x="144" y="30" fill="#1f2328" font-size="12.5" font-weight="600">Neuro-Symbolic Short-Circuit:</text>
      <text x="345" y="30" fill="#59636e" font-size="12.5">L4 quote verification terminates 73.6% of non-joke inputs before L5, saving &gt;65% downstream LLM tokens.</text>
    </g>
  </g>
</svg>
