<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">CRACK pipeline architecture (L0-L8)</title>
  <desc id="arch-desc">Hierarchical diagram of the CRACK humor evaluation system across 3 distinct phases: deterministic lexical foundation, constrained LLM reasoning, and developmental safety evaluation.</desc>

  <!-- Outer Card -->
  <rect x="0.5" y="0.5" width="999" height="729" rx="14" fill="#ffffff" stroke="#e1e4e8"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-variant-numeric="tabular-nums">
    <!-- Header -->
    <text x="32" y="38" fill="#0969da" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.5">CRACK  /  SYSTEM PIPELINE</text>
    <text x="32" y="74" fill="#1f2328" font-size="26" font-weight="700" text-anchor="start">CRACK Pipeline Architecture (L0–L8)</text>
    <text x="32" y="100" fill="#59636e" font-size="13.5" font-weight="400" text-anchor="start">Lexical retrieval, model-assisted reasoning, and age-related estimates</text>

    <!-- Top Input Bar -->
    <g transform="translate(20, 118)">
      <rect x="0" y="0" width="960" height="42" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
      <rect x="14" y="10" width="56" height="22" rx="4" fill="#ddf4ff" stroke="#54aeff66"/>
      <text x="42" y="25" fill="#0969da" font-size="11" font-weight="700" text-anchor="middle">INPUT</text>
      <text x="82" y="26" fill="#1f2328" font-size="13" font-weight="600">Raw Joke Text + Target Ages (e.g. 6, 8, 10, 12)</text>
      <text x="940" y="26" fill="#656d76" font-size="11.5" text-anchor="end">Single unified CLI / Python entrypoint</text>
    </g>

    <!-- Column 1: Stage 1 Deterministic Foundation -->
    <g transform="translate(20, 174)">
      <rect x="0" y="0" width="306" height="474" rx="10" fill="#f6f8fa" stroke="#54aeff66" stroke-width="1.2"/>

      <!-- Stage Header -->
      <rect x="14" y="14" width="138" height="22" rx="4" fill="#ddf4ff"/>
      <text x="83" y="29" fill="#0969da" font-size="10.5" font-weight="700" text-anchor="middle">STAGE 1 · SYMBOLIC</text>
      <text x="14" y="58" fill="#1f2328" font-size="17" font-weight="700">Lexical Foundation</text>
      <text x="14" y="76" fill="#59636e" font-size="12">No LLM calls in this stage</text>

      <!-- Block 1: L0 -->
      <rect x="12" y="94" width="282" height="74" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="24" y="116" fill="#1f2328" font-size="13" font-weight="700">L0-pre — Input validation</text>
      <text x="24" y="134" fill="#59636e" font-size="11.5">Checks text length and content</text>
      <text x="24" y="152" fill="#656d76" font-size="11">Scope decision follows analysis</text>

      <!-- Block 2: L1 -->
      <rect x="12" y="178" width="282" height="74" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="24" y="200" fill="#1f2328" font-size="13" font-weight="700">L1 — Syntactic &amp; Genre Routing</text>
      <text x="24" y="218" fill="#59636e" font-size="11.5">Tokenize text and detect structure</text>
      <text x="24" y="236" fill="#656d76" font-size="11">Routes: QA, Dialogue, One-Liner, Decl</text>

      <!-- Block 3: L2 -->
      <rect x="12" y="262" width="282" height="74" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="24" y="284" fill="#1f2328" font-size="13" font-weight="700">L2 — Symbolic Sense Retrieval</text>
      <text x="24" y="302" fill="#59636e" font-size="11.5">WordNet 3.0 Synsets + SemCor</text>
      <text x="24" y="320" fill="#656d76" font-size="11">Word-level AoA lookup</text>

      <!-- Block 4: L3 -->
      <rect x="12" y="346" width="282" height="74" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="24" y="368" fill="#1f2328" font-size="13" font-weight="700">L3 — Candidate Ranking</text>
      <text x="24" y="386" fill="#59636e" font-size="11.5">Contrast (0.70) + Balance (0.30)</text>
      <text x="24" y="404" fill="#0969da" font-size="11" font-weight="600">Extracts Top-8 candidates -&gt;</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <path d="M331 411 H342 M337 407 L342 411 L337 415" stroke="#0969da" stroke-width="2" fill="none"/>

    <!-- Column 2: Stage 2 Constrained LLM Reasoning -->
    <g transform="translate(347, 174)">
      <rect x="0" y="0" width="306" height="474" rx="10" fill="#f6f8fa" stroke="#c297ff66" stroke-width="1.2"/>

      <!-- Stage Header -->
      <rect x="14" y="14" width="132" height="22" rx="4" fill="#fbefff"/>
      <text x="80" y="29" fill="#8250df" font-size="10.5" font-weight="700" text-anchor="middle">STAGE 2 · NEURAL</text>
      <text x="14" y="58" fill="#1f2328" font-size="17" font-weight="700">Constrained Reasoning</text>
      <text x="14" y="76" fill="#59636e" font-size="12">Verbatim Quote Grounding</text>

      <!-- Block 1: L4 -->
      <rect x="12" y="94" width="282" height="106" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="24" y="116" fill="#1f2328" font-size="13" font-weight="700">L4 — Bidirectional Anchoring</text>
      <text x="24" y="134" fill="#59636e" font-size="11.5">Requires non-empty quotes for</text>
      <text x="24" y="150" fill="#59636e" font-size="11.5">both Sense A &amp; Sense B</text>
      <!-- Safe short-circuit pill with generous inner padding -->
      <rect x="22" y="162" width="238" height="24" rx="4" fill="#ffebe9" stroke="#ff818266"/>
      <text x="141" y="178" fill="#cf222e" font-size="10.5" font-weight="700" text-anchor="middle">ONE_SENSE_ONLY → skips L5/L6</text>

      <!-- Block 2: L5 -->
      <rect x="12" y="210" width="282" height="106" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="24" y="232" fill="#1f2328" font-size="13" font-weight="700">L5 — Incongruity Resolution</text>
      <text x="24" y="250" fill="#59636e" font-size="11.5">QA: Polarity, Causal, Event Fit</text>
      <text x="24" y="268" fill="#59636e" font-size="11.5">Dialogue: Speaker mismatch</text>
      <text x="24" y="286" fill="#656d76" font-size="11">Definitional: Resegmentation</text>

      <!-- Block 3: L6 -->
      <rect x="12" y="326" width="282" height="94" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="24" y="348" fill="#1f2328" font-size="13" font-weight="700">L6 — Sense Distinctness</text>
      <text x="24" y="366" fill="#59636e" font-size="11.5">Paraphrase ablation test</text>
      <text x="24" y="384" fill="#59636e" font-size="11.5">Filters polysemous synonyms</text>
      <text x="24" y="402" fill="#8250df" font-size="11" font-weight="600">SENSES_DISTINCT -&gt; To L7</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <path d="M658 411 H669 M664 407 L669 411 L664 415" stroke="#8250df" stroke-width="2" fill="none"/>

    <!-- Column 3: Stage 3 Cognitive & Safety -->
    <g transform="translate(674, 174)">
      <rect x="0" y="0" width="306" height="474" rx="10" fill="#f6f8fa" stroke="#4ac26b66" stroke-width="1.2"/>

      <!-- Stage Header -->
      <rect x="14" y="14" width="144" height="22" rx="4" fill="#dafbe1"/>
      <text x="86" y="29" fill="#1a7f37" font-size="10.5" font-weight="700" text-anchor="middle">STAGE 3 · COGNITIVE</text>
      <text x="14" y="58" fill="#1f2328" font-size="17" font-weight="700">Safety &amp; Assessment</text>
      <text x="14" y="76" fill="#59636e" font-size="12">Multi-Age Developmental Model</text>

      <!-- Block 1: L7 -->
      <rect x="12" y="94" width="282" height="96" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="24" y="116" fill="#1f2328" font-size="13" font-weight="700">L7 — Comprehension Model</text>
      <text x="24" y="134" fill="#59636e" font-size="11.5">Dual-Sense AoA evaluation</text>
      <text x="24" y="152" fill="#59636e" font-size="11.5">Metalinguistic floor matching</text>
      <text x="24" y="170" fill="#656d76" font-size="11">Verdicts for Ages 6, 8, 10, 12</text>

      <!-- Block 2: L8 -->
      <rect x="12" y="200" width="282" height="96" rx="6" fill="#ffffff" stroke="#e1e4e8"/>
      <text x="24" y="222" fill="#1f2328" font-size="13" font-weight="700">L8 — Two-Axis Appropriateness</text>
      <text x="24" y="240" fill="#59636e" font-size="11.5">Axis 1: Surface content (safety)</text>
      <text x="24" y="258" fill="#59636e" font-size="11.5">Axis 2: Inference depth (adult)</text>
      <text x="24" y="276" fill="#656d76" font-size="11">Returns appropriateness estimates</text>

      <!-- Block 3: Output with ample right padding -->
      <rect x="12" y="306" width="282" height="114" rx="6" fill="#dafbe1" stroke="#4ac26b66"/>
      <text x="24" y="328" fill="#1a7f37" font-size="12.5" font-weight="700">L0-post · FINAL CLASSIFICATION</text>
      <text x="24" y="348" fill="#1f2328" font-size="11.5" font-weight="600">• Wordplay Classification</text>
      <text x="24" y="366" fill="#1f2328" font-size="11.5" font-weight="600">• Pun Location &amp; Anchors</text>
      <text x="24" y="384" fill="#1f2328" font-size="11.5" font-weight="600">• Target-Age Appropriateness</text>
      <text x="24" y="402" fill="#59636e" font-size="11">Structured run trace (when saved)</text>
    </g>

    <!-- Pipeline note -->
    <g transform="translate(20, 660)">
      <rect x="0" y="0" width="960" height="50" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
      <rect x="14" y="13" width="124" height="24" rx="4" fill="#1a7f37"/>
      <text x="76" y="29" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">STAGED ANALYSIS</text>
      <text x="150" y="29" fill="#1f2328" font-size="12" font-weight="700">Early exits:</text>
      <text x="290" y="29" fill="#59636e" font-size="11.5">Stages can stop when prerequisites fail; no token-saving estimate is reported.</text>
    </g>
  </g>
</svg>
