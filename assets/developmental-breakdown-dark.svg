<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title description">
  <title id="title">CRACK evaluation status</title>
  <desc id="description">The saved SemEval detection arithmetic is internally consistent but its run provenance is incomplete. The current curated corpus does not have a valid full-set score.</desc>
  <rect x="0.5" y="0.5" width="959" height="359" rx="14" fill="#0d1117" stroke="#30363d"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="32" y="42" fill="#58a6ff" font-size="12" font-weight="700" letter-spacing="1.4">EVALUATION STATUS</text>
    <text x="32" y="82" fill="#f0f6fc" font-size="26" font-weight="700">Read scores with their evidence</text>
    <rect x="32" y="112" width="432" height="190" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="56" y="150" fill="#f0f6fc" font-size="17" font-weight="700">SemEval-2017 · 2,250 items</text>
    <text x="56" y="184" fill="#8b949e" font-size="14">Detection counts and F1 arithmetic match</text>
    <text x="56" y="207" fill="#8b949e" font-size="14">the local run records.</text>
    <text x="56" y="252" fill="#d29922" font-size="13" font-weight="700">Run records are not tracked by Git.</text>
    <text x="56" y="274" fill="#8b949e" font-size="12">Model-call provenance remains unverified.</text>
    <rect x="496" y="112" width="432" height="190" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="520" y="150" fill="#f0f6fc" font-size="17" font-weight="700">Curated corpus · 60 items</text>
    <text x="520" y="184" fill="#8b949e" font-size="14">Four outputs were copied; eight saved</text>
    <text x="520" y="207" fill="#8b949e" font-size="14">outputs refer to different text.</text>
    <text x="520" y="252" fill="#d29922" font-size="13" font-weight="700">No full-corpus accuracy is reported.</text>
    <text x="520" y="274" fill="#8b949e" font-size="12">Details: docs/benchmark_audit.md</text>
    <text x="32" y="334" fill="#8b949e" font-size="12">Age and safety judgments are exploratory estimates, not validated child-safety guarantees.</text>
  </g>
</svg>
