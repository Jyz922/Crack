<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title description">
  <title id="title">CRACK Developmental Alignment and Neuro-Symbolic Funnel</title>
  <desc id="description">Visual breakdown of child developmental humor alignment (110 items) and the neuro-symbolic hallucination suppression funnel on 2,250 items.</desc>
  
  <!-- Outer Container -->
  <rect x="0.5" y="0.5" width="999" height="429" rx="14" fill="#0d1117" stroke="#30363d"/>
  
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-variant-numeric="tabular-nums">
    <!-- Header -->
    <text x="32" y="38" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.5">CRACK  /  DETAILED METRICS</text>
    <text x="32" y="74" fill="#f0f6fc" font-size="26" font-weight="700" text-anchor="start">Developmental Cognition &amp; Error Analysis</text>
    <text x="32" y="100" fill="#8b949e" font-size="14" font-weight="400" text-anchor="start">Empirical Age-of-Acquisition (AoA) alignment and token-efficient negative filtering</text>
    <path d="M20 118 H980" stroke="#21262d" stroke-width="1"/>
    
    <!-- Left Card: Child-Directed Benchmark -->
    <g transform="translate(20, 132)">
      <rect x="0" y="0" width="465" height="274" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="22" y="32" fill="#3fb950" font-size="11" font-weight="700" letter-spacing="1">CHILD-DIRECTED CORPUS (110 ITEMS)</text>
      <text x="22" y="58" fill="#f0f6fc" font-size="18" font-weight="700">Developmental Appropriateness</text>
      
      <!-- Metric 1 -->
      <text x="22" y="96" fill="#f0f6fc" font-size="12.5" font-weight="600">Classification Accuracy</text>
      <text x="360" y="96" fill="#3fb950" font-size="13" font-weight="700" text-anchor="end">88.2%</text>
      <text x="442" y="96" fill="#6e7681" font-size="11" text-anchor="end">97 / 110</text>
      <rect x="22" y="104" width="420" height="7" rx="3.5" fill="#21262d"/>
      <rect x="22" y="104" width="370.44" height="7" rx="3.5" fill="#2ea043"/>
      
      <!-- Metric 2 -->
      <text x="22" y="140" fill="#f0f6fc" font-size="12.5" font-weight="600">Age Verdict Alignment (Ages 6–12)</text>
      <text x="360" y="140" fill="#3fb950" font-size="13" font-weight="700" text-anchor="end">90.0%</text>
      <text x="442" y="140" fill="#6e7681" font-size="11" text-anchor="end">251 / 279</text>
      <rect x="22" y="148" width="420" height="7" rx="3.5" fill="#21262d"/>
      <rect x="22" y="148" width="378.0" height="7" rx="3.5" fill="#2ea043"/>
      
      <!-- Metric 3 -->
      <text x="22" y="184" fill="#f0f6fc" font-size="12.5" font-weight="600">Negative Control Specificity</text>
      <text x="360" y="184" fill="#3fb950" font-size="13" font-weight="700" text-anchor="end">95.5%</text>
      <text x="442" y="184" fill="#6e7681" font-size="11" text-anchor="end">42 / 44</text>
      <rect x="22" y="192" width="420" height="7" rx="3.5" fill="#21262d"/>
      <rect x="22" y="192" width="401.09999999999997" height="7" rx="3.5" fill="#2ea043"/>
      
      <!-- Metric 4 -->
      <text x="22" y="228" fill="#f0f6fc" font-size="12.5" font-weight="600">Deterministic Test Suite (332 Tests)</text>
      <text x="360" y="228" fill="#3fb950" font-size="13" font-weight="700" text-anchor="end">100.0%</text>
      <text x="442" y="228" fill="#6e7681" font-size="11" text-anchor="end">332 / 332</text>
      <rect x="22" y="236" width="420" height="7" rx="3.5" fill="#21262d"/>
      <rect x="22" y="236" width="420.0" height="7" rx="3.5" fill="#2ea043"/>
    </g>
    
    <!-- Right Card: Confusion Matrix & Funnel -->
    <g transform="translate(515, 132)">
      <rect x="0" y="0" width="465" height="274" rx="10" fill="#161b22" stroke="#30363d"/>
      <text x="22" y="32" fill="#58a6ff" font-size="11" font-weight="700" letter-spacing="1">SEMEVAL-2017 FUNNEL (2,250 ITEMS)</text>
      <text x="22" y="58" fill="#f0f6fc" font-size="18" font-weight="700">Rejection &amp; Efficiency Breakdown</text>
      
      <!-- Stat row 1 -->
      <g transform="translate(20, 80)">
        <rect x="0" y="0" width="202" height="66" rx="6" fill="#0d1117" stroke="#30363d"/>
        <text x="14" y="22" fill="#8b949e" font-size="11" font-weight="600">TRUE PUN DETECTION</text>
        <text x="14" y="48" fill="#58a6ff" font-size="20" font-weight="700">87.05%</text>
        <text x="188" y="46" fill="#6e7681" font-size="10.5" text-anchor="end">1,399 / 1,607</text>
      </g>
      
      <!-- Stat row 2 -->
      <g transform="translate(242, 80)">
        <rect x="0" y="0" width="202" height="66" rx="6" fill="#0d1117" stroke="#30363d"/>
        <text x="14" y="22" fill="#8b949e" font-size="11" font-weight="600">EARLY SHORT-CIRCUIT</text>
        <text x="14" y="48" fill="#3fb950" font-size="20" font-weight="700">73.56%</text>
        <text x="188" y="46" fill="#6e7681" font-size="10.5" text-anchor="end">473 rejected at L4</text>
      </g>
      
      <!-- Explanation Note Box -->
      <rect x="20" y="162" width="424" height="88" rx="6" fill="#0d1117" stroke="#30363d"/>
      <text x="32" y="186" fill="#f0f6fc" font-size="12" font-weight="700">Neuro-Symbolic Efficiency:</text>
      <text x="32" y="206" fill="#8b949e" font-size="11.5">Requiring verbatim context quotes at L4 eliminates 73.6% of</text>
      <text x="32" y="224" fill="#8b949e" font-size="11.5">non-joke proverbs early, saving &gt;65% downstream LLM tokens.</text>
    </g>
  </g>
</svg>
