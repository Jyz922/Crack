<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">CRACK System Architecture: 8-Layer Neuro-Symbolic Pipeline</title>
  <desc id="arch-desc">Hierarchical diagram of the CRACK humor evaluation system across 3 distinct phases: deterministic lexical foundation, constrained LLM reasoning, and developmental safety evaluation.</desc>
  
  <!-- Outer Card -->
  <rect x="0.5" y="0.5" width="999" height="729" rx="14" fill="#0d1117" stroke="#30363d"/>
  
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-variant-numeric="tabular-nums">
    <!-- Header -->
    <text x="32" y="38" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.5">CRACK  /  SYSTEM PIPELINE</text>
    <text x="32" y="74" fill="#f0f6fc" font-size="26" font-weight="700" text-anchor="start">Neuro-Symbolic 8-Layer Architecture (L0–L8)</text>
    <text x="32" y="100" fill="#8b949e" font-size="13.5" font-weight="400" text-anchor="start">Deterministic lexical ontologies + Schema-constrained LLM reasoning + Developmental multi-age modeling</text>
    
    <!-- Top Input Bar -->
    <g transform="translate(20, 118)">
      <rect x="0" y="0" width="960" height="42" rx="7" fill="#161b22" stroke="#30363d"/>
      <rect x="14" y="10" width="56" height="22" rx="4" fill="#1f6feb33" stroke="#388bfd44"/>
      <text x="42" y="25" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">INPUT</text>
      <text x="82" y="26" fill="#f0f6fc" font-size="13" font-weight="600">Raw Joke Text + Target Ages (e.g. 6, 8, 10, 12)</text>
      <text x="940" y="26" fill="#6e7681" font-size="11.5" text-anchor="end">Single unified CLI / Python entrypoint</text>
    </g>

    <!-- Column 1: Stage 1 Deterministic Foundation -->
    <g transform="translate(20, 174)">
      <rect x="0" y="0" width="306" height="474" rx="10" fill="#161b22" stroke="#388bfd44" stroke-width="1.2"/>
      
      <!-- Stage Header -->
      <rect x="14" y="14" width="138" height="22" rx="4" fill="#1f6feb33"/>
      <text x="83" y="29" fill="#58a6ff" font-size="10.5" font-weight="700" text-anchor="middle">STAGE 1 · SYMBOLIC</text>
      <text x="14" y="58" fill="#f0f6fc" font-size="17" font-weight="700">Lexical Foundation</text>
      <text x="14" y="76" fill="#8b949e" font-size="12">0 Tokens · Deterministic Search</text>
      
      <!-- Block 1: L0 -->
      <rect x="12" y="94" width="282" height="74" rx="6" fill="#0d1117" stroke="#21262d"/>
      <text x="24" y="116" fill="#f0f6fc" font-size="13" font-weight="700">L0 — Scope Boundary Gate</text>
      <text x="24" y="134" fill="#8b949e" font-size="11.5">Accepts homographs &amp; splits</text>
      <text x="24" y="152" fill="#6e7681" font-size="11">Filters homophones &amp; rhymes</text>

      <!-- Block 2: L1 -->
      <rect x="12" y="178" width="282" height="74" rx="6" fill="#0d1117" stroke="#21262d"/>
      <text x="24" y="200" fill="#f0f6fc" font-size="13" font-weight="700">L1 — Syntactic &amp; Genre Routing</text>
      <text x="24" y="218" fill="#8b949e" font-size="11.5">Tokenize, POS, Lemmatization</text>
      <text x="24" y="236" fill="#6e7681" font-size="11">Routes: QA, Dialogue, One-Liner, Decl</text>

      <!-- Block 3: L2 -->
      <rect x="12" y="262" width="282" height="74" rx="6" fill="#0d1117" stroke="#21262d"/>
      <text x="24" y="284" fill="#f0f6fc" font-size="13" font-weight="700">L2 — Symbolic Sense Retrieval</text>
      <text x="24" y="302" fill="#8b949e" font-size="11.5">WordNet 3.0 Synsets + SemCor</text>
      <text x="24" y="320" fill="#6e7681" font-size="11">Kuperman AoA 4-stage join</text>

      <!-- Block 4: L3 -->
      <rect x="12" y="346" width="282" height="74" rx="6" fill="#0d1117" stroke="#21262d"/>
      <text x="24" y="368" fill="#f0f6fc" font-size="13" font-weight="700">L3 — Candidate Ranking</text>
      <text x="24" y="386" fill="#8b949e" font-size="11.5">Contrast (0.70) + Balance (0.30)</text>
      <text x="24" y="404" fill="#58a6ff" font-size="11" font-weight="600">Extracts Top-8 candidates -&gt;</text>
    </g>

    <!-- Connector 1 -> 2 -->
    <path d="M331 411 H342 M337 407 L342 411 L337 415" stroke="#58a6ff" stroke-width="2" fill="none"/>

    <!-- Column 2: Stage 2 Constrained LLM Reasoning -->
    <g transform="translate(347, 174)">
      <rect x="0" y="0" width="306" height="474" rx="10" fill="#161b22" stroke="#8957e544" stroke-width="1.2"/>
      
      <!-- Stage Header -->
      <rect x="14" y="14" width="132" height="22" rx="4" fill="#a371f733"/>
      <text x="80" y="29" fill="#bc8cff" font-size="10.5" font-weight="700" text-anchor="middle">STAGE 2 · NEURAL</text>
      <text x="14" y="58" fill="#f0f6fc" font-size="17" font-weight="700">Constrained Reasoning</text>
      <text x="14" y="76" fill="#8b949e" font-size="12">Verbatim Quote Grounding</text>
      
      <!-- Block 1: L4 -->
      <rect x="12" y="94" width="282" height="106" rx="6" fill="#0d1117" stroke="#21262d"/>
      <text x="24" y="116" fill="#f0f6fc" font-size="13" font-weight="700">L4 — Bidirectional Anchoring</text>
      <text x="24" y="134" fill="#8b949e" font-size="11.5">Requires non-empty quotes for</text>
      <text x="24" y="150" fill="#8b949e" font-size="11.5">both Sense A &amp; Sense B</text>
      <!-- Safe short-circuit pill with generous inner padding -->
      <rect x="22" y="162" width="238" height="24" rx="4" fill="#f8514922" stroke="#f8514955"/>
      <text x="141" y="178" fill="#ff7b72" font-size="10.5" font-weight="700" text-anchor="middle">ONE_SENSE_ONLY → Early Exit</text>

      <!-- Block 2: L5 -->
      <rect x="12" y="210" width="282" height="106" rx="6" fill="#0d1117" stroke="#21262d"/>
      <text x="24" y="232" fill="#f0f6fc" font-size="13" font-weight="700">L5 — Incongruity Resolution</text>
      <text x="24" y="250" fill="#8b949e" font-size="11.5">QA: Polarity, Causal, Event Fit</text>
      <text x="24" y="268" fill="#8b949e" font-size="11.5">Dialogue: Speaker mismatch</text>
      <text x="24" y="286" fill="#6e7681" font-size="11">Definitional: Resegmentation</text>

      <!-- Block 3: L6 -->
      <rect x="12" y="326" width="282" height="94" rx="6" fill="#0d1117" stroke="#21262d"/>
      <text x="24" y="348" fill="#f0f6fc" font-size="13" font-weight="700">L6 — Sense Distinctness</text>
      <text x="24" y="366" fill="#8b949e" font-size="11.5">Paraphrase ablation test</text>
      <text x="24" y="384" fill="#8b949e" font-size="11.5">Filters polysemous synonyms</text>
      <text x="24" y="402" fill="#bc8cff" font-size="11" font-weight="600">SENSES_DISTINCT -&gt; To L7</text>
    </g>

    <!-- Connector 2 -> 3 -->
    <path d="M658 411 H669 M664 407 L669 411 L664 415" stroke="#bc8cff" stroke-width="2" fill="none"/>

    <!-- Column 3: Stage 3 Cognitive & Safety -->
    <g transform="translate(674, 174)">
      <rect x="0" y="0" width="306" height="474" rx="10" fill="#161b22" stroke="#2ea04344" stroke-width="1.2"/>
      
      <!-- Stage Header -->
      <rect x="14" y="14" width="144" height="22" rx="4" fill="#23863633"/>
      <text x="86" y="29" fill="#3fb950" font-size="10.5" font-weight="700" text-anchor="middle">STAGE 3 · COGNITIVE</text>
      <text x="14" y="58" fill="#f0f6fc" font-size="17" font-weight="700">Safety &amp; Assessment</text>
      <text x="14" y="76" fill="#8b949e" font-size="12">Multi-Age Developmental Model</text>
      
      <!-- Block 1: L7 -->
      <rect x="12" y="94" width="282" height="96" rx="6" fill="#0d1117" stroke="#21262d"/>
      <text x="24" y="116" fill="#f0f6fc" font-size="13" font-weight="700">L7 — Comprehension Model</text>
      <text x="24" y="134" fill="#8b949e" font-size="11.5">Dual-Sense AoA evaluation</text>
      <text x="24" y="152" fill="#8b949e" font-size="11.5">Metalinguistic floor matching</text>
      <text x="24" y="170" fill="#6e7681" font-size="11">Verdicts for Ages 6, 8, 10, 12</text>

      <!-- Block 2: L8 -->
      <rect x="12" y="200" width="282" height="96" rx="6" fill="#0d1117" stroke="#21262d"/>
      <text x="24" y="222" fill="#f0f6fc" font-size="13" font-weight="700">L8 — Two-Axis Appropriateness</text>
      <text x="24" y="240" fill="#8b949e" font-size="11.5">Axis 1: Surface content (safety)</text>
      <text x="24" y="258" fill="#8b949e" font-size="11.5">Axis 2: Inference depth (adult)</text>
      <text x="24" y="276" fill="#6e7681" font-size="11">Protects young readers</text>

      <!-- Block 3: Output with ample right padding -->
      <rect x="12" y="306" width="282" height="114" rx="6" fill="#23863633" stroke="#2ea04344"/>
      <text x="24" y="328" fill="#3fb950" font-size="12.5" font-weight="700">FINAL STRUCTURED VERDICT</text>
      <text x="24" y="348" fill="#f0f6fc" font-size="11.5" font-weight="600">• Wordplay Classification</text>
      <text x="24" y="366" fill="#f0f6fc" font-size="11.5" font-weight="600">• Pun Location &amp; Anchors</text>
      <text x="24" y="384" fill="#f0f6fc" font-size="11.5" font-weight="600">• Target-Age Appropriateness</text>
      <text x="24" y="402" fill="#8b949e" font-size="11">Full reproducible audit trace</text>
    </g>

    <!-- Bottom Rejection Funnel Callout with guaranteed boundary fit -->
    <g transform="translate(20, 660)">
      <rect x="0" y="0" width="960" height="50" rx="7" fill="#161b22" stroke="#30363d"/>
      <rect x="14" y="13" width="124" height="24" rx="4" fill="#238636"/>
      <text x="76" y="29" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">TOKEN SAVINGS</text>
      <text x="150" y="29" fill="#f0f6fc" font-size="12" font-weight="700">Early Rejection Funnel:</text>
      <text x="290" y="29" fill="#8b949e" font-size="11.5">L4 quote verification drops 73.6% of non-jokes early, saving &gt;65% downstream LLM tokens.</text>
    </g>
  </g>
</svg>
