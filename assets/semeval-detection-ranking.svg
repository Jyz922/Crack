<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title description">
  <title id="title">SemEval-2017 Task 7 homographic pun detection ranking</title>
  <desc id="description">Eleven reported F1 results ranked from highest to lowest. CRACK is first with 87.82 percent. Feng et al. is second with 87.50 percent. Diao et al. Bi-LSTM-E, Bi-LSTM-Attention, and Bi-LSTM follow with 85.46, 85.26, and 84.51 percent. N-Hance scores 83.50, Duluth 82.54, JU_CSE_NLP 80.63, PunFields 76.51, ECNU 67.85, and UWAV 55.87 percent.</desc>
